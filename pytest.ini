[pytest]
asyncio_mode = auto
testpaths = tests
# tests/ha/ needs pytest-homeassistant-custom-component (Linux/CI); run it explicitly
# there with `pytest tests/ha --override-ini addopts=`. For the light run we disable
# the ptcc plugin: its event_loop fixture crashes on Windows' ProactorEventLoop and
# its socket guard blocks the pure-logic tests.
addopts = --ignore=tests/ha -p no:homeassistant
