[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tools"]  # standalone dev/homologation scripts, not shipped

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "ASYNC",
    "BLE",  # flake8-blind-except
    "SLF",  # flake8-self
]
ignore = [
    "RUF012",    # mutable class attrs — HA entity_description pattern
    "SIM102",    # nested if — sometimes clearer
    "SIM117",    # nested with
    "ASYNC109",  # a `timeout` kwarg on our ISAPI helpers mirrors aiohttp's own
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SLF001", "S101"]
