name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff pytest pytest-asyncio pytest-homeassistant-custom-component
      - name: Ruff
        run: ruff check custom_components/hikvision_access
      - name: Unit tests (no HA)
        run: pytest -q
      - name: HA lifecycle tests
        run: pytest tests/ha -q --override-ini addopts=

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # brands requires a separate PR to home-assistant/brands (pending)
          ignore: brands
